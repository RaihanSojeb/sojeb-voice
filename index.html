<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>সজীব টেলিকম - ভয়েস হিসাব</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: #0f172a;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .app-card {
      background: #ffffff;
      padding: 28px 20px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    .badge {
      background: #dcfce7;
      color: #166534;
      font-size: 13px;
      font-weight: 700;
      padding: 5px 14px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 10px;
    }
    h1 { margin: 0 0 6px; color: #0f172a; font-size: 26px; }
    p.hint { margin: 0 0 24px; color: #64748b; font-size: 15px; }
    .mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      font-size: 46px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
      margin-bottom: 22px;
      transition: 0.2s;
    }
    .mic-btn.listening {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.6); }
      70% { transform: scale(1.08); box-shadow: 0 0 0 22px rgba(239, 68, 68, 0); }
      100% { transform: scale(1); }
    }
    input[type="text"] {
      width: 100%;
      padding: 16px;
      font-size: 19px;
      border: 2px solid #cbd5e1;
      border-radius: 14px;
      text-align: center;
      margin-bottom: 14px;
    }
    .save-btn {
      width: 100%;
      padding: 16px;
      font-size: 19px;
      font-weight: 700;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 14px;
      cursor: pointer;
    }
    .save-btn:disabled { background: #94a3b8; }
    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      display: none;
      white-space: pre-line;
      line-height: 1.5;
    }
    .status.ok { display: block; background: #dcfce7; color: #166534; }
    .status.err { display: block; background: #fee2e2; color: #991b1b; }
    .status.info { display: block; background: #e0f2fe; color: #075985; }
  </style>
</head>
<body>
  <div class="app-card">
    <div class="badge">⚡ স্মার্ট ভয়েস সিস্টেম</div>
    <h1>সজীব টেলিকম</h1>
    <p class="hint">মাইকে চাপ দিয়ে বলুন:<br><b>"সজীব বিকাশ ১০ হাজার বাকি"</b></p>

    <button type="button" id="micBtn" class="mic-btn">🎤</button>
    <input type="text" id="entryInput" placeholder="ভয়েস বলুন বা লিখুন...">
    <button type="button" id="saveBtn" class="save-btn">✅ শিটে সেভ করুন</button>

    <div id="statusBox" class="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw2xhSgVJBJ6KUb2i4NBhe_gWRne1R_egTrbqW1yS1ST-gd3hxFsAwiI2pQwagmVsy0AA/exec";

    const micBtn = document.getElementById('micBtn');
    const entryInput = document.getElementById('entryInput');
    const saveBtn = document.getElementById('saveBtn');
    const statusBox = document.getElementById('statusBox');

    function showStatus(msg, type) {
      statusBox.className = "status " + type;
      statusBox.innerText = msg;
    }

    // বাংলা কথায় লেখা সংখ্যাকে সরাসরি ডিজিটে রূপান্তর করার স্মার্ট ফাংশন
    function normalizeBanglaNumbers(text) {
      const bnToEn = { '০':'0','১':'1','২':'2','৩':'3','৪':'4','৫':'5','৬':'6','৭':'7','৮':'8','৯':'9' };
      let res = String(text).replace(/[০-৯]/g, m => bnToEn[m]);

      const wordMap = {
        'এক': 1, 'দুই': 2, 'তিন': 3, 'চার': 4, 'পাঁচ': 5, 'পাচ': 5, 'ছয়': 6, 'ছয়': 6,
        'সাত': 7, 'আট': 8, 'নয়': 9, 'নয়': 9, 'দশ': 10, 'এগারো': 11, 'বারো': 12,
        'তেরো': 13, 'চৌদ্দ': 14, 'পনেরো': 15, 'ষোল': 16, 'সতেরো': 17, 'আঠারো': 18,
        'উনিশ': 19, 'বিশ': 20, 'পঁচিশ': 25, 'ত্রিশ': 30, 'চল্লিশ': 40, 'পঞ্চাশ': 50,
        'ষাট': 60, 'সত্তর': 70, 'আশি': 80, 'নব্বই': 90
      };

      // ভগ্নাংশের বিশেষ কথা (দেড়, আড়াই, সাড়ে)
      res = res.replace(/দেড়\s*হাজার/g, "1500").replace(/দেড়\s*শত?|দেড়শ/g, "150");
      res = res.replace(/আড়াই\s*হাজার/g, "2500").replace(/আড়াই\s*শত?|আড়াইশ/g, "250");
      res = res.replace(/সাড়ে\s*(\d+|[অ-হ]+)\s*হাজার/g, (m, p1) => {
        let num = parseFloat(p1) || wordMap[p1] || 0;
        return num ? String((num * 1000) + 500) : m;
      });
      res = res.replace(/সাড়ে\s*(\d+|[অ-হ]+)\s*(শত|শো|শ)/g, (m, p1) => {
        let num = parseFloat(p1) || wordMap[p1] || 0;
        return num ? String((num * 100) + 50) : m;
      });

      // একক ও যৌগিক সংখ্যা রূপান্তর (যেমন: "১০ হাজার ৫ শত" -> "10500", "১৫ শত" -> "1500")
      const tokens = res.split(/\s+/);
      let output = [];
      let currentSum = 0;
      let hasNumber = false;

      for (let i = 0; i < tokens.length; i++) {
        let tok = tokens[i];
        let val = null;

        let attachedMatch = tok.match(/^(\d+(?:\.\d+)?)(হাজার|লক্ষ|লাখ|শত|শো|শ)$/);
        if (attachedMatch) {
          let base = parseFloat(attachedMatch[1]);
          let unit = attachedMatch[2];
          if (unit === 'লক্ষ' || unit === 'লাখ') currentSum += base * 100000;
          else if (unit === 'হাজার') currentSum += base * 1000;
          else currentSum += base * 100;
          hasNumber = true;
          continue;
        }

        if (/^\d+(?:\.\d+)?$/.test(tok)) {
          val = parseFloat(tok);
        } else if (wordMap[tok] !== undefined) {
          val = wordMap[tok];
        }

        if (val !== null) {
          let nextTok = tokens[i + 1] || "";
          if (nextTok === 'লক্ষ' || nextTok === 'লাখ') {
            currentSum += val * 100000;
            hasNumber = true;
            i++;
          } else if (nextTok === 'হাজার') {
            currentSum += val * 1000;
            hasNumber = true;
            i++;
          } else if (nextTok === 'শত' || nextTok === 'শো' || nextTok === 'শ') {
            currentSum += val * 100;
            hasNumber = true;
            i++;
          } else {
            if (hasNumber) {
              currentSum += val;
            } else {
              currentSum = val;
              hasNumber = true;
            }
          }
        } else if (tok === 'হাজার' && !hasNumber) {
          currentSum += 1000;
          hasNumber = true;
        } else if ((tok === 'শত' || tok === 'শো' || tok === 'শ') && !hasNumber) {
          currentSum += 100;
          hasNumber = true;
        } else {
          if (hasNumber) {
            output.push(String(currentSum));
            currentSum = 0;
            hasNumber = false;
          }
          output.push(tok);
        }
      }
      if (hasNumber) {
        output.push(String(currentSum));
      }

      return output.join(" ");
    }

    async function submitData() {
      const rawVal = entryInput.value.trim();
      if (!rawVal) return;

      const normalizedVal = normalizeBanglaNumbers(rawVal);
      entryInput.value = normalizedVal;

      saveBtn.disabled = true;
      saveBtn.innerText = "⏳ সেভ হচ্ছে...";

      try {
        const response = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ text: normalizedVal })
        });
        const res = await response.json();
        if (res.success) {
          showStatus(res.message, "ok");
          entryInput.value = "";
        } else {
          showStatus(res.message, "err");
        }
      } catch (err) {
        showStatus("⚠️ কানেকশন ত্রুটি! ইন্টারনেট বা SCRIPT_URL চেক করুন।", "err");
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "✅ শিটে সেভ করুন";
      }
    }

    saveBtn.addEventListener('click', submitData);
    entryInput.addEventListener('keypress', function(e) { if (e.key === 'Enter') submitData(); });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognition = new SpeechRecognition();
      recognition.lang = 'bn-BD';
      recognition.interimResults = false;

      recognition.onstart = function() {
        micBtn.classList.add('listening');
        showStatus("🎙️ শুনছি... কথা বলুন", "info");
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        entryInput.value = normalizeBanglaNumbers(transcript);
        submitData();
      };

      recognition.onerror = function(event) {
        micBtn.classList.remove('listening');
        showStatus("⚠️ ভয়েস ত্রুটি: " + event.error, "err");
      };

      recognition.onend = function() {
        micBtn.classList.remove('listening');
      };

      micBtn.addEventListener('click', function() {
        try { recognition.start(); } catch (e) { recognition.stop(); }
      });
    } else {
      showStatus("এই ব্রাউজারে ভয়েস সাপোর্ট নেই, Chrome ব্যবহার করুন।", "err");
    }
  </script>
</body>
</html>
